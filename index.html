<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tymos</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #f0e9dc;
  --surface:   #ece4d5;
  --surface2:  #e4dac8;
  --surface3:  #d9cdb8;
  --border:    rgba(120,95,65,0.14);
  --border2:   rgba(120,95,65,0.22);
  --text:      #2e1f0d;
  --text2:     #6b5340;
  --muted:     #a08b75;
  --accent:    #7c5c3a;
  --accent2:   #a07850;
  --accent3:   #c9a87a;
  --accent-bg: rgba(124,92,58,0.08);
  --red:       #b84f3a;
  --green:     #4a8c5c;
  --blue:      #3a6b8c;
  --yellow:    #b8903a;
  --ring-work: #a07850;
  --ring-break:#5a8ca0;
  --shadow:    0 2px 12px rgba(80,50,20,0.10);
  --shadow2:   0 4px 24px rgba(80,50,20,0.14);
}

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 28px;
  background: var(--surface);
  border-bottom: 1px solid var(--border2);
  flex-shrink: 0;
}

.logo {
  font-family: 'Lora', serif;
  font-size: 17px;
  font-weight: 500;
  color: var(--accent);
  letter-spacing: 0.02em;
}

.session-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--surface3);
  transition: background 0.3s;
}
.session-dot.filled { background: var(--accent2); }
.session-dot.active { background: var(--accent); box-shadow: 0 0 5px var(--accent3); }

.mode-tag {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.1em;
}

.main {
  flex: 1;
  display: grid;
  grid-template-columns: 420px 1px 1fr;
  overflow: hidden;
}

.divider { background: var(--border2); }

/* ── TIMER ── */
.timer-panel {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 36px;
  gap: 28px;
  background: var(--surface);
  overflow-y: auto;
}

.ring-wrap { position: relative; width: 220px; height: 220px; flex-shrink: 0; }
.ring-svg { width: 220px; height: 220px; transform: rotate(-90deg); }
.ring-track { fill: none; stroke: var(--surface3); stroke-width: 4; }
.ring-fill {
  fill: none; stroke: var(--ring-work); stroke-width: 4; stroke-linecap: round;
  transition: stroke-dashoffset 1s linear, stroke 0.5s;
}
.ring-center {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.timer-time {
  font-family: 'DM Mono', monospace;
  font-size: 46px; font-weight: 300; color: var(--text);
  letter-spacing: -2px; line-height: 1;
}
.timer-sublabel {
  font-size: 10px; font-weight: 600; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--muted); margin-top: 4px;
}

.presets { display: flex; gap: 6px; }
.preset-btn {
  font-family: 'DM Mono', monospace; font-size: 11px;
  padding: 5px 13px; border-radius: 100px;
  border: 1px solid var(--border2); background: transparent;
  color: var(--text2); cursor: pointer; transition: all 0.15s;
}
.preset-btn:hover { background: var(--surface2); }
.preset-btn.active { background: var(--accent); border-color: var(--accent); color: #f5ede0; }

.controls { display: flex; gap: 10px; align-items: center; }
.btn {
  font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 600;
  border: 1px solid var(--border2); background: transparent; color: var(--text2);
  cursor: pointer; border-radius: 8px; padding: 9px 18px; transition: all 0.15s;
}
.btn:hover { background: var(--surface2); }
.btn:active { transform: scale(0.97); }
.btn-primary {
  background: var(--accent); color: #f5ede0; border-color: transparent;
  padding: 9px 32px; font-size: 14px; box-shadow: 0 2px 8px rgba(124,92,58,0.25);
}
.btn-primary:hover { background: var(--accent2); }

.stats-row { display: flex; gap: 20px; width: 100%; justify-content: center; }
.stat-block { text-align: center; }
.stat-val { font-family: 'DM Mono', monospace; font-size: 20px; font-weight: 400; color: var(--text); }
.stat-lbl { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }

/* ── TASK PANEL ── */
.task-panel { display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
.task-panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 24px 14px; border-bottom: 1px solid var(--border);
  background: var(--surface); flex-shrink: 0;
}
.panel-title { font-family: 'Lora', serif; font-size: 14px; font-weight: 500; color: var(--text); }
.add-task-btn {
  display: flex; align-items: center; gap: 6px;
  font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 600;
  color: var(--accent); background: var(--accent-bg);
  border: 1px solid rgba(124,92,58,0.2); border-radius: 6px;
  padding: 5px 12px; cursor: pointer; transition: all 0.15s;
}
.add-task-btn:hover { background: rgba(124,92,58,0.15); }

.task-list {
  flex: 1; overflow-y: auto; padding: 12px 16px;
  display: flex; flex-direction: column; gap: 6px;
}
.task-list::-webkit-scrollbar { width: 4px; }
.task-list::-webkit-scrollbar-track { background: transparent; }
.task-list::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }

/* Task cards */
.task-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; cursor: pointer; transition: all 0.18s;
  overflow: hidden; box-shadow: var(--shadow);
}
.task-card:hover { border-color: var(--border2); box-shadow: var(--shadow2); }
.task-card.active { border-color: var(--accent3); box-shadow: 0 4px 20px rgba(124,92,58,0.18); }
.task-card.done { opacity: 0.5; }

.task-card-header {
  display: flex; align-items: flex-start; gap: 10px; padding: 13px 14px;
}
.task-priority-bar { width: 3px; border-radius: 4px; flex-shrink: 0; align-self: stretch; min-height: 16px; }
.pri-high   { background: var(--red); }
.pri-medium { background: var(--yellow); }
.pri-low    { background: var(--green); }

.task-card-body { flex: 1; min-width: 0; }
.task-card-title {
  font-size: 14px; font-weight: 600; color: var(--text);
  line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.task-card-meta { display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.task-badge { font-family: 'DM Mono', monospace; font-size: 10px; padding: 2px 7px; border-radius: 100px; letter-spacing: 0.05em; }
.badge-high   { background: rgba(184,79,58,0.12); color: var(--red); }
.badge-medium { background: rgba(184,144,58,0.12); color: var(--yellow); }
.badge-low    { background: rgba(74,140,92,0.12); color: var(--green); }
.task-progress-mini { font-size: 11px; color: var(--muted); }

.task-card-actions { display: flex; gap: 2px; flex-shrink: 0; }
.icon-btn {
  width: 28px; height: 28px; border-radius: 6px; border: none;
  background: transparent; color: var(--muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; transition: all 0.15s;
}
.icon-btn:hover { background: var(--surface2); color: var(--text); }
.icon-btn.confirm-delete { background: rgba(184,79,58,0.12); color: var(--red); font-size: 11px; width: auto; padding: 0 6px; }

/* Expanded */
.task-sections {
  border-top: 1px solid var(--border); padding: 0 14px 12px;
  display: none; flex-direction: column; gap: 8px;
}
.task-sections.open { display: flex; }

.section-block { margin-top: 10px; }
.section-header {
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 6px;
}
.section-name-text {
  font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--muted); flex: 1;
}
.section-divider-line {
  flex: 1; height: 1px; background: var(--border); margin-left: 4px;
}
.section-del-btn {
  width: 20px; height: 20px; border-radius: 4px; border: none;
  background: transparent; color: var(--muted); cursor: pointer;
  font-size: 11px; display: flex; align-items: center; justify-content: center;
  transition: all 0.12s; flex-shrink: 0; opacity: 0;
}
.section-block:hover .section-del-btn { opacity: 1; }
.section-del-btn:hover { background: rgba(184,79,58,0.12); color: var(--red); }
.section-del-btn.confirm-delete { opacity: 1; background: rgba(184,79,58,0.12); color: var(--red); font-size: 9px; width: auto; padding: 0 5px; }

.section-items { display: flex; flex-direction: column; gap: 4px; }
.section-item {
  display: flex; align-items: center; gap: 8px; padding: 5px 4px;
  cursor: pointer; border-radius: 5px; transition: background 0.12s;
}
.section-item:hover { background: var(--surface2); }
.check-box {
  width: 15px; height: 15px; border: 1.5px solid var(--border2);
  border-radius: 4px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; transition: all 0.15s; color: transparent;
}
.section-item.done-item .check-box { background: var(--green); border-color: var(--green); color: white; }
.section-item.done-item .item-text { text-decoration: line-through; opacity: 0.5; }
.item-text { font-size: 13px; color: var(--text); flex: 1; }

.section-add-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.section-add-input {
  flex: 1; background: transparent; border: none;
  border-bottom: 1px dashed var(--border2); color: var(--text);
  font-family: 'Nunito', sans-serif; font-size: 12px; padding: 4px 0; outline: none;
}
.section-add-input::placeholder { color: var(--muted); }
.section-add-input:focus { border-bottom-color: var(--accent2); }

.task-notes {
  font-size: 12px; color: var(--text2); line-height: 1.5;
  background: var(--surface2); border-radius: 6px; padding: 8px 10px;
  margin-top: 8px; white-space: pre-wrap; cursor: text; min-height: 32px;
  outline: none; border: 1px solid transparent; transition: border-color 0.15s;
}
.task-notes:focus { border-color: var(--border2); }
.task-notes:empty::before { content: 'Add notes...'; color: var(--muted); }

.task-footer {
  display: flex; align-items: center; justify-content: space-between; padding: 8px 0 2px;
}
.add-section-btn {
  font-size: 11px; font-weight: 600; color: var(--accent2); background: none;
  border: none; cursor: pointer; padding: 3px 6px; border-radius: 4px;
  transition: background 0.12s; font-family: 'Nunito', sans-serif;
}
.add-section-btn:hover { background: var(--accent-bg); }

/* Inline add-section row */
.inline-section-add {
  display: flex; align-items: center; gap: 6px; margin-top: 6px;
  padding: 6px 8px; background: var(--surface2); border-radius: 6px;
  border: 1px dashed var(--border2);
}
.inline-section-input {
  flex: 1; background: transparent; border: none; outline: none;
  font-family: 'Nunito', sans-serif; font-size: 12px; color: var(--text);
}
.inline-section-input::placeholder { color: var(--muted); }
.inline-section-confirm {
  font-size: 11px; font-weight: 700; color: var(--accent);
  background: none; border: none; cursor: pointer; padding: 2px 6px;
  border-radius: 4px; font-family: 'Nunito', sans-serif;
}
.inline-section-confirm:hover { background: var(--accent-bg); }

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(30,18,8,0.4);
  display: flex; align-items: center; justify-content: center;
  z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }

.modal {
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: 14px; padding: 28px 28px 24px;
  width: 500px; max-width: 94vw;
  max-height: 88vh; overflow-y: auto;
  box-shadow: var(--shadow2);
  transform: translateY(12px); transition: transform 0.2s;
}
.modal::-webkit-scrollbar { width: 4px; }
.modal::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }
.modal-overlay.open .modal { transform: translateY(0); }

.modal-title {
  font-family: 'Lora', serif; font-size: 18px; font-weight: 500;
  color: var(--text); margin-bottom: 20px;
}

.form-field { margin-bottom: 16px; }
.form-label {
  display: block; font-size: 11px; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
}
.form-input, .form-textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--border2);
  border-radius: 8px; color: var(--text); font-family: 'Nunito', sans-serif;
  font-size: 14px; padding: 10px 12px; outline: none; transition: border-color 0.15s;
}
.form-input:focus, .form-textarea:focus { border-color: var(--accent2); }
.form-textarea { min-height: 64px; resize: vertical; }

.pri-row { display: flex; gap: 8px; }
.pri-chip {
  flex: 1; padding: 8px; border: 1.5px solid var(--border2); border-radius: 7px;
  background: transparent; cursor: pointer; font-family: 'Nunito', sans-serif;
  font-size: 12px; font-weight: 600; text-align: center; transition: all 0.15s; color: var(--text2);
}
.pri-chip.sel-high   { background: rgba(184,79,58,0.15); border-color: var(--red); color: var(--red); }
.pri-chip.sel-medium { background: rgba(184,144,58,0.15); border-color: var(--yellow); color: var(--yellow); }
.pri-chip.sel-low    { background: rgba(74,140,92,0.15); border-color: var(--green); color: var(--green); }

.modal-sections { display: flex; flex-direction: column; gap: 8px; }

.modal-section-row {
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  overflow: hidden; transition: border-color 0.15s;
}
.modal-section-row:focus-within { border-color: var(--border2); }
.modal-section-top { display: flex; align-items: center; }

.modal-section-name {
  flex: 1; background: transparent; border: none;
  font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700;
  color: var(--text); padding: 9px 12px; outline: none; letter-spacing: 0.04em;
}
.modal-section-name::placeholder { color: var(--muted); font-weight: 400; }

.modal-sec-del {
  width: 34px; height: 34px; border: none; background: transparent;
  color: var(--muted); cursor: pointer; display: flex; align-items: center;
  justify-content: center; font-size: 15px; transition: all 0.12s; flex-shrink: 0;
}
.modal-sec-del:hover { background: rgba(184,79,58,0.1); color: var(--red); }

.modal-section-items {
  border-top: 1px solid var(--border); padding: 6px 10px 8px;
  display: flex; flex-direction: column; gap: 4px;
}
.modal-item-row { display: flex; align-items: center; gap: 6px; }
.modal-item-input {
  flex: 1; background: transparent; border: none;
  font-family: 'Nunito', sans-serif; font-size: 12px; color: var(--text);
  padding: 4px 2px; outline: none;
}
.modal-item-input::placeholder { color: var(--muted); }
.modal-item-del {
  width: 22px; height: 22px; border: none; background: transparent;
  color: var(--muted); cursor: pointer; border-radius: 4px;
  font-size: 13px; display: flex; align-items: center; justify-content: center;
  transition: all 0.12s; opacity: 0; flex-shrink: 0;
}
.modal-item-row:hover .modal-item-del { opacity: 1; }
.modal-item-del:hover { background: rgba(184,79,58,0.1); color: var(--red); }
.modal-item-add {
  display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
  cursor: pointer; padding: 3px 2px; border: none; background: transparent;
  font-family: 'Nunito', sans-serif; transition: color 0.12s;
}
.modal-item-add:hover { color: var(--accent2); }

.add-modal-section-btn {
  display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
  color: var(--accent); background: var(--accent-bg);
  border: 1px dashed rgba(124,92,58,0.3); border-radius: 8px;
  padding: 9px 14px; cursor: pointer; width: 100%;
  font-family: 'Nunito', sans-serif; transition: all 0.15s;
}
.add-modal-section-btn:hover { background: rgba(124,92,58,0.13); }

.modal-actions {
  display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px;
  border-top: 1px solid var(--border); padding-top: 16px;
}
.btn-ghost {
  font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 600;
  border: 1px solid var(--border2); background: transparent; color: var(--text2);
  cursor: pointer; border-radius: 7px; padding: 8px 16px; transition: all 0.15s;
}
.btn-ghost:hover { background: var(--surface2); }
.btn-save {
  font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700;
  border: none; background: var(--accent); color: #f5ede0;
  cursor: pointer; border-radius: 7px; padding: 8px 20px; transition: all 0.15s;
}
.btn-save:hover { background: var(--accent2); }

/* Notify */
.notif {
  position: fixed; top: 20px; left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: var(--accent); color: #f5ede0;
  border-radius: 10px; padding: 11px 22px;
  font-size: 13px; font-weight: 600;
  box-shadow: 0 4px 16px rgba(80,50,20,0.22);
  transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), opacity 0.3s;
  z-index: 200; white-space: nowrap; pointer-events: none;
  opacity: 0;
}
.notif.show { transform: translateX(-50%) translateY(0); opacity: 1; }

body.break-mode .ring-fill { stroke: var(--ring-break); }
body.break-mode .btn-primary { background: var(--ring-break); box-shadow: 0 2px 8px rgba(58,107,140,0.25); }

/* Click feedback */
button:active { transform: scale(0.95); opacity: 0.85; }
.btn:active { transform: scale(0.95); }
.btn-primary:active { transform: scale(0.95); }
.preset-btn:active { transform: scale(0.92); }
.icon-btn:active { transform: scale(0.88); }
.add-task-btn:active { transform: scale(0.95); }

/* Focus indicators */
button:focus-visible, input:focus-visible, [contenteditable]:focus-visible {
  outline: 2px solid var(--accent2);
  outline-offset: 2px;
}

/* ── MOBILE ── */
@media (max-width: 680px) {
  body { overflow: auto; height: auto; }
  .main { grid-template-columns: 1fr; grid-template-rows: auto auto; overflow: visible; }
  .divider { display: none; }
  .timer-panel { padding: 28px 20px; gap: 20px; }
  .task-panel { min-height: 50vh; }
  .ring-wrap { width: 180px; height: 180px; }
  .ring-svg { width: 180px; height: 180px; }
  .timer-time { font-size: 38px; }
}
</style>
</head>
<body>

<div class="header">
  <span class="logo">Tymos</span>
  <div style="display:flex;gap:6px;" id="sessionDots"></div>
  <span class="mode-tag" id="modeTag">Work Session</span>
</div>

<div class="main">
  <div class="timer-panel">
    <div class="ring-wrap">
      <svg class="ring-svg" viewBox="0 0 220 220">
        <circle class="ring-track" cx="110" cy="110" r="98"/>
        <circle class="ring-fill" id="ring" cx="110" cy="110" r="98"
          stroke-dasharray="615.75" stroke-dashoffset="0"/>
      </svg>
      <div class="ring-center">
        <div class="timer-time" id="timerDisplay">25:00</div>
        <div class="timer-sublabel" id="timerSub">Focus</div>
      </div>
    </div>
    <div class="presets">
      <button class="preset-btn active" onclick="setPreset(25,this)">25m</button>
      <button class="preset-btn" onclick="setPreset(50,this)">50m</button>
      <button class="preset-btn" onclick="setPreset(90,this)">90m</button>
    </div>
    <div class="controls">
      <button class="btn" onclick="resetTimer()">Reset</button>
      <button class="btn btn-primary" id="startBtn" onclick="toggleTimer()">Start</button>
      <button class="btn" onclick="skipPhase()">Skip</button>
    </div>
    <div class="stats-row">
      <div class="stat-block">
        <div class="stat-val" id="statSessions">0</div>
        <div class="stat-lbl">Sessions</div>
      </div>
      <div class="stat-block" style="border-left:1px solid var(--border);padding-left:20px;">
        <div class="stat-val" id="statTime">0m</div>
        <div class="stat-lbl">Focus Time</div>
      </div>
      <div class="stat-block" style="border-left:1px solid var(--border);padding-left:20px;">
        <div class="stat-val" id="statTasks">0</div>
        <div class="stat-lbl">Done</div>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="task-panel">
    <div class="task-panel-header">
      <span class="panel-title">Tasks</span>
      <button class="add-task-btn" onclick="openModal()">+ Add Task</button>
    </div>
    <div class="task-list" id="taskList"></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-title" id="modalTitle">New Task</div>
    <div class="form-field">
      <label class="form-label">Task Name</label>
      <input class="form-input" id="mTaskName" placeholder="What needs to get done?">
    </div>
    <div class="form-field">
      <label class="form-label">Priority</label>
      <div class="pri-row">
        <button class="pri-chip sel-high" data-pri="high" onclick="selectPri(this)">High</button>
        <button class="pri-chip" data-pri="medium" onclick="selectPri(this)">Medium</button>
        <button class="pri-chip" data-pri="low" onclick="selectPri(this)">Low</button>
      </div>
    </div>
    <div class="form-field">
      <label class="form-label">Notes</label>
      <textarea class="form-textarea" id="mTaskNotes" placeholder="Any context or details..."></textarea>
    </div>
    <div class="form-field">
      <label class="form-label">Sections</label>
      <div class="modal-sections" id="modalSections"></div>
      <button class="add-modal-section-btn" style="margin-top:8px;" onclick="addModalSection()">+ Add Section</button>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveTask()">Save Task</button>
    </div>
  </div>
</div>

<div class="notif" id="notif"></div>

<script>
// ── HTML ESCAPE (XSS prevention) ──
function esc(str) {
  return String(str ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ── SOUND ──
function playChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [523.25, 659.25, 783.99].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine'; osc.frequency.value = freq;
      const t = ctx.currentTime + i * 0.18;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.18, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
      osc.start(t); osc.stop(t + 0.5);
    });
  } catch(e) {}
}

// ── TIMER ──
const CIRC = 2 * Math.PI * 98;
let workSecs = 25*60, totalSecs = 25*60, remaining = 25*60;
let running = false, isBreak = false, interval = null;

const ringEl = document.getElementById('ring');
ringEl.style.strokeDasharray = CIRC;

const fmt = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
const updateRing = () => { ringEl.style.strokeDashoffset = CIRC * (1 - remaining/totalSecs); };

function setPreset(min, el) {
  if (running) return;
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  workSecs = min*60; totalSecs = workSecs; remaining = workSecs;
  document.getElementById('timerDisplay').textContent = fmt(remaining);
  updateRing();
}

function toggleTimer() {
  if (running) {
    clearInterval(interval); running = false;
    document.getElementById('startBtn').textContent = 'Resume';
  } else {
    running = true;
    document.getElementById('startBtn').textContent = 'Pause';
    interval = setInterval(tick, 1000);
  }
}

function tick() {
  if (remaining <= 0) {
    clearInterval(interval); running = false;
    playChime();
    if (!isBreak) {
      sessionsComplete++; totalFocusSecs += workSecs;
      notify('Session complete — take a break!');
      enterBreak();
    } else {
      notify('Break over — back to work.');
      enterWork();
    }
    saveStats(); updateStats(); buildDots();
    return;
  }
  remaining--;
  if (!isBreak) totalFocusSecs++;
  document.getElementById('timerDisplay').textContent = fmt(remaining);
  updateRing();
  if (remaining % 60 === 0) { updateStats(); saveStats(); }
}

function enterBreak() {
  isBreak = true; totalSecs = 5*60; remaining = 5*60;
  document.getElementById('timerSub').textContent = 'Break';
  document.getElementById('modeTag').textContent = 'Short Break';
  document.getElementById('startBtn').textContent = 'Start Break';
  document.getElementById('timerDisplay').textContent = fmt(remaining);
  document.body.classList.add('break-mode'); updateRing();
}

function enterWork() {
  isBreak = false; totalSecs = workSecs; remaining = workSecs;
  document.getElementById('timerSub').textContent = 'Focus';
  document.getElementById('modeTag').textContent = 'Work Session';
  document.getElementById('startBtn').textContent = 'Start';
  document.getElementById('timerDisplay').textContent = fmt(remaining);
  document.body.classList.remove('break-mode'); updateRing();
}

function resetTimer() {
  clearInterval(interval); running = false; isBreak = false;
  remaining = workSecs; totalSecs = workSecs;
  document.getElementById('timerDisplay').textContent = fmt(remaining);
  document.getElementById('timerSub').textContent = 'Focus';
  document.getElementById('modeTag').textContent = 'Work Session';
  document.getElementById('startBtn').textContent = 'Start';
  document.body.classList.remove('break-mode'); updateRing();
}

function skipPhase() { clearInterval(interval); running = false; isBreak ? enterWork() : enterBreak(); }

// ── LOCALSTORAGE ──
const LS_TASKS   = 'tymos_tasks';
const LS_NEXT_ID = 'tymos_next_id';
const LS_STATS   = 'tymos_stats';

function saveTasks() {
  localStorage.setItem(LS_TASKS, JSON.stringify(tasks));
  localStorage.setItem(LS_NEXT_ID, nextId);
}
function loadTasks() {
  try {
    const t = localStorage.getItem(LS_TASKS);
    const id = localStorage.getItem(LS_NEXT_ID);
    if (t) tasks = JSON.parse(t);
    if (id) nextId = parseInt(id);
  } catch(e) { tasks = []; }
}
function saveStats() {
  localStorage.setItem(LS_STATS, JSON.stringify({sessionsComplete, totalFocusSecs, tasksDone}));
}
function loadStats() {
  try {
    const s = localStorage.getItem(LS_STATS);
    if (s) { const d = JSON.parse(s); sessionsComplete = d.sessionsComplete||0; totalFocusSecs = d.totalFocusSecs||0; tasksDone = d.tasksDone||0; }
  } catch(e) {}
}

// ── STATS ──
let sessionsComplete = 0, totalFocusSecs = 0, tasksDone = 0;
loadStats();

function updateStats() {
  document.getElementById('statSessions').textContent = sessionsComplete;
  document.getElementById('statTime').textContent = Math.floor(totalFocusSecs/60) + 'm';
  document.getElementById('statTasks').textContent = tasksDone;
}

function buildDots() {
  const wrap = document.getElementById('sessionDots');
  wrap.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const d = document.createElement('span');
    d.className = 'session-dot' +
      (i < sessionsComplete % 4 ? ' filled' : '') +
      (i === sessionsComplete % 4 && !isBreak ? ' active' : '');
    wrap.appendChild(d);
  }
}

updateStats(); buildDots();

const notify = msg => {
  const n = document.getElementById('notif');
  n.textContent = msg; n.classList.add('show');
  setTimeout(() => n.classList.remove('show'), 2800);
};

// ── TASKS ──
let tasks = [];
let nextId = 1, editingId = null, selectedPri = 'high', expandedId = null;
let draftSections = [];
let pendingDeleteTask = null, pendingDeleteSection = null, pendingInlineAdd = null;

loadTasks();

function renderTasks() {
  const list = document.getElementById('taskList');
  if (!tasks.length) {
    list.innerHTML = `<div style="text-align:center;color:var(--muted);font-size:13px;padding:40px 0;">No tasks yet — add one above.</div>`;
    return;
  }
  const sorted = [...tasks].sort((a,b) => {
    const p = {high:0,medium:1,low:2};
    if (a.done !== b.done) return a.done ? 1 : -1;
    return p[a.priority] - p[b.priority];
  });
  list.innerHTML = sorted.map(t => taskCardHTML(t)).join('');
}

function taskCardHTML(t) {
  const total = t.sections.reduce((a,s) => a + s.items.length, 0);
  const done  = t.sections.reduce((a,s) => a + s.items.filter(i=>i.done).length, 0);
  const isOpen = expandedId === t.id;
  const isConfirmDel = pendingDeleteTask === t.id;

  const sectionsHTML = t.sections.map((sec, si) => {
    const isConfirmSec = pendingDeleteSection && pendingDeleteSection.tid===t.id && pendingDeleteSection.si===si;
    return `
    <div class="section-block">
      <div class="section-header">
        <span class="section-name-text">${esc(sec.name)}</span>
        <div class="section-divider-line"></div>
        <button class="section-del-btn${isConfirmSec?' confirm-delete':''}"
          onclick="event.stopPropagation();deleteSectionClick(${t.id},${si})">${isConfirmSec?'Sure?':'✕'}</button>
      </div>
      <div class="section-items">
        ${sec.items.map((item,ii) => `
          <div class="section-item${item.done?' done-item':''}"
            onclick="event.stopPropagation();toggleItem(${t.id},${si},${ii})">
            <div class="check-box">${item.done?'✓':''}</div>
            <span class="item-text">${esc(item.text)}</span>
          </div>`).join('')}
        <div class="section-add-row" onclick="event.stopPropagation()">
          <input class="section-add-input" placeholder="+ Add item"
            onkeydown="addItem(event,${t.id},${si})">
        </div>
      </div>
    </div>`; }).join('');

  const showInline = isOpen && pendingInlineAdd === t.id;

  return `
  <div class="task-card${t.done?' done':''}${isOpen?' active':''}" id="task-${t.id}">
    <div class="task-card-header" onclick="toggleExpand(${t.id})">
      <div class="task-priority-bar pri-${t.priority}"></div>
      <div class="task-card-body">
        <div class="task-card-title">${esc(t.title)}</div>
        <div class="task-card-meta">
          <span class="task-badge badge-${t.priority}">${t.priority}</span>
          ${total > 0 ? `<span class="task-progress-mini">${done}/${total} done</span>` : ''}
        </div>
      </div>
      <div class="task-card-actions" onclick="event.stopPropagation()">
        <button class="icon-btn" onclick="openModal(${t.id})">✏️</button>
        <button class="icon-btn" onclick="toggleDone(${t.id})">${t.done?'↩':'✓'}</button>
        <button class="icon-btn${isConfirmDel?' confirm-delete':''}"
          onclick="deleteTaskClick(${t.id})">${isConfirmDel?'Sure?':'🗑'}</button>
      </div>
    </div>
    <div class="task-sections${isOpen?' open':''}">
      <div class="task-notes" contenteditable="true"
        onblur="saveNotes(${t.id},this)">${esc(t.notes||'')}</div>
      ${sectionsHTML}
      <div class="task-footer">
        <button class="add-section-btn" onclick="event.stopPropagation();showInlineAddSection(${t.id})">+ Add Section</button>
      </div>
      ${showInline ? `
        <div class="inline-section-add" onclick="event.stopPropagation()">
          <input class="inline-section-input" id="inlineSecInput-${t.id}"
            placeholder="Section name..."
            onkeydown="inlineSectionKeydown(event,${t.id})">
          <button class="inline-section-confirm" onclick="commitInlineSection(${t.id})">Add</button>
        </div>` : ''}
    </div>
  </div>`;
}

function showInlineAddSection(tid) {
  pendingInlineAdd = tid; expandedId = tid; renderTasks();
  setTimeout(() => { const el = document.getElementById(`inlineSecInput-${tid}`); if(el) el.focus(); }, 30);
}
function inlineSectionKeydown(e, tid) {
  if (e.key === 'Enter') { e.preventDefault(); commitInlineSection(tid); }
  if (e.key === 'Escape') { pendingInlineAdd = null; renderTasks(); }
}
function commitInlineSection(tid) {
  const el = document.getElementById(`inlineSecInput-${tid}`);
  const name = el ? el.value.trim() : '';
  if (!name) { pendingInlineAdd = null; renderTasks(); return; }
  tasks.find(x=>x.id===tid).sections.push({name, items:[]});
  pendingInlineAdd = null; expandedId = tid; saveTasks(); renderTasks();
}

function toggleExpand(id) {
  pendingDeleteTask = null; pendingDeleteSection = null; pendingInlineAdd = null;
  expandedId = expandedId === id ? null : id; renderTasks();
}

function deleteTaskClick(id) {
  if (pendingDeleteTask === id) {
    tasks = tasks.filter(x=>x.id!==id);
    if (expandedId===id) expandedId = null;
    pendingDeleteTask = null; saveTasks(); renderTasks();
  } else {
    pendingDeleteTask = id; renderTasks();
    setTimeout(() => { if (pendingDeleteTask===id) { pendingDeleteTask=null; renderTasks(); } }, 3000);
  }
}

function deleteSectionClick(tid, si) {
  if (pendingDeleteSection && pendingDeleteSection.tid===tid && pendingDeleteSection.si===si) {
    tasks.find(x=>x.id===tid).sections.splice(si,1);
    pendingDeleteSection = null; expandedId = tid; saveTasks(); renderTasks();
  } else {
    pendingDeleteSection = {tid,si}; renderTasks();
    setTimeout(() => { if(pendingDeleteSection&&pendingDeleteSection.tid===tid&&pendingDeleteSection.si===si){pendingDeleteSection=null;renderTasks();} }, 3000);
  }
}

function toggleDone(id) {
  const t = tasks.find(x=>x.id===id); t.done = !t.done;
  tasksDone += t.done ? 1 : -1; tasksDone = Math.max(0, tasksDone);
  updateStats(); saveTasks(); saveStats(); renderTasks();
}

function toggleItem(tid, si, ii) {
  tasks.find(x=>x.id===tid).sections[si].items[ii].done ^= true;
  expandedId = tid; saveTasks(); renderTasks();
}

function addItem(e, tid, si) {
  if (e.key !== 'Enter') return;
  const val = e.target.value.trim(); if (!val) return;
  tasks.find(x=>x.id===tid).sections[si].items.push({text:val,done:false});
  expandedId = tid; saveTasks(); renderTasks();
}

function saveNotes(tid, el) {
  tasks.find(x=>x.id===tid).notes = el.innerText.trim(); saveTasks();
}

// ── MODAL ──
function openModal(id = null) {
  editingId = id; selectedPri = 'high'; draftSections = [];
  document.getElementById('modalTitle').textContent = id ? 'Edit Task' : 'New Task';
  if (id) {
    const t = tasks.find(x=>x.id===id);
    document.getElementById('mTaskName').value = t.title;
    document.getElementById('mTaskNotes').value = t.notes;
    selectedPri = t.priority;
    draftSections = t.sections.map(s => ({name:s.name, items:s.items.map(i=>({text:i.text,done:i.done}))}));
  } else {
    document.getElementById('mTaskName').value = '';
    document.getElementById('mTaskNotes').value = '';
    draftSections = [];
  }
  document.querySelectorAll('.pri-chip').forEach(c => {
    c.className = 'pri-chip';
    if (c.dataset.pri === selectedPri) c.classList.add('sel-' + selectedPri);
  });
  renderModalSections();
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(() => document.getElementById('mTaskName').focus(), 150);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  editingId = null; draftSections = [];
}
function closeModalOutside(e) { if (e.target === document.getElementById('modalOverlay')) closeModal(); }

function selectPri(el) {
  selectedPri = el.dataset.pri;
  document.querySelectorAll('.pri-chip').forEach(c => {
    c.className = 'pri-chip';
    if (c.dataset.pri === selectedPri) c.classList.add('sel-' + selectedPri);
  });
}

function renderModalSections() {
  document.getElementById('modalSections').innerHTML = draftSections.map((sec,si) => `
    <div class="modal-section-row" id="msec-${si}">
      <div class="modal-section-top">
        <input class="modal-section-name" value="${esc(sec.name)}" placeholder="Section name"
          oninput="draftSections[${si}].name=this.value">
        <button class="modal-sec-del" onclick="deleteModalSection(${si})">✕</button>
      </div>
      <div class="modal-section-items" id="msec-items-${si}">
        ${sec.items.map((item,ii) => `
          <div class="modal-item-row">
            <input class="modal-item-input" value="${esc(item.text)}" placeholder="Item..."
              oninput="draftSections[${si}].items[${ii}].text=this.value"
              onkeydown="modalItemKeydown(event,${si},${ii})">
            <button class="modal-item-del" onclick="deleteModalItem(${si},${ii})">✕</button>
          </div>`).join('')}
        <button class="modal-item-add" onclick="addModalItem(${si})">+ Add item</button>
      </div>
    </div>`).join('');
}

function addModalSection() {
  draftSections.push({name:'',items:[]}); renderModalSections();
  setTimeout(() => { const i = document.querySelectorAll('.modal-section-name'); if(i.length) i[i.length-1].focus(); }, 50);
}
function deleteModalSection(si) { draftSections.splice(si,1); renderModalSections(); }
function addModalItem(si) {
  draftSections[si].items.push({text:'',done:false}); renderModalSections();
  setTimeout(() => { const r = document.querySelectorAll(`#msec-items-${si} .modal-item-input`); if(r.length) r[r.length-1].focus(); }, 50);
}
function deleteModalItem(si,ii) { draftSections[si].items.splice(ii,1); renderModalSections(); }
function modalItemKeydown(e,si,ii) { if(e.key==='Enter'){e.preventDefault();addModalItem(si);} }

function saveTask() {
  const name = document.getElementById('mTaskName').value.trim();
  if (!name) { document.getElementById('mTaskName').focus(); return; }
  const notes = document.getElementById('mTaskNotes').value.trim();

  document.querySelectorAll('.modal-section-name').forEach((inp,si) => { if(draftSections[si]) draftSections[si].name=inp.value.trim(); });
  document.querySelectorAll('.modal-item-input').forEach(inp => {
    const si = parseInt(inp.closest('[id^="msec-items-"]').id.replace('msec-items-',''));
    const ii = Array.from(inp.parentElement.parentElement.querySelectorAll('.modal-item-input')).indexOf(inp);
    if(draftSections[si]&&draftSections[si].items[ii]!==undefined) draftSections[si].items[ii].text=inp.value.trim();
  });

  const cleanSections = draftSections.filter(s=>s.name.trim()).map(s=>({name:s.name.trim(),items:s.items.filter(i=>i.text.trim())}));

  if (editingId) {
    const t = tasks.find(x=>x.id===editingId);
    t.title=name; t.notes=notes; t.priority=selectedPri; t.sections=cleanSections;
  } else {
    tasks.push({id:nextId++,title:name,priority:selectedPri,done:false,notes,sections:cleanSections});
  }
  closeModal(); saveTasks(); renderTasks();
  notify(editingId ? 'Task updated.' : 'Task added!');
}

document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });
renderTasks();
</script>
</body>
</html>
