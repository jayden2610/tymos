<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="#f0e9dc"/>

  <!-- Ring track -->
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="#d9cdb8" stroke-width="2.5"/>

  <!-- Progress arc (~75%, clockwise from top) -->
  <!-- circumference = 2π × 9.5 ≈ 59.69 | 75% = 44.77 -->
  <circle
    cx="16" cy="16" r="9.5"
    fill="none"
    stroke="#7c5c3a"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-dasharray="44.8 59.7"
    transform="rotate(-90 16 16)"
  />

  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.5" fill="#a07850"/>
</svg>
