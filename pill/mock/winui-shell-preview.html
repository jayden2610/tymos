<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tymos pill — WinUI shell preview</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Nunito:wght@600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background:
      linear-gradient(160deg, rgba(124,92,58,0.18), transparent 42%),
      linear-gradient(25deg, #3d3428 0%, #1f1a14 55%, #2c251c 100%);
    font-family: 'Nunito', 'Segoe UI', sans-serif;
    overflow: hidden;
  }
  .chrome {
    position: absolute;
    left: 50%;
    bottom: 36px;
    transform: translateX(-50%);
    width: 440px;
    height: 88px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    background: transparent;
  }
  .pill {
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: 420px;
    padding: 10px 18px 10px 14px;
    border-radius: 999px;
    background: #f0e9dc;
    border: 1px solid rgba(120,95,65,0.22);
    box-shadow: 0 4px 24px rgba(80,50,20,0.14);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #a07850; flex-shrink: 0; }
  .time {
    font-family: 'DM Mono', 'Cascadia Mono', Consolas, monospace;
    font-size: 18px; color: #2e1f0d; min-width: 4.2em;
  }
  .div { width: 1px; height: 18px; background: rgba(120,95,65,0.22); }
  .title {
    font-size: 13px; font-weight: 600; color: #6b5340;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px;
  }
  .phase {
    font-family: 'DM Mono', 'Cascadia Mono', Consolas, monospace;
    font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: #a08b75;
  }
  .badge {
    position: absolute; top: 24px; left: 28px;
    color: rgba(240,233,220,0.45); font-size: 12px; font-weight: 600;
  }
</style>
</head>
<body>
  <div class="badge">WinUI shell preview — bottom center, always-on-top chrome</div>
  <div class="chrome">
    <div class="pill">
      <span class="dot"></span>
      <span class="time">24:32</span>
      <span class="div"></span>
      <span class="title">Ship floating pill</span>
      <span class="phase">Focus</span>
    </div>
  </div>
</body>
</html>
