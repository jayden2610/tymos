<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tymos pill — WinUI shell preview</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Nunito:wght@600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background:
      linear-gradient(160deg, rgba(124,92,58,0.18), transparent 42%),
      linear-gradient(25deg, #3d3428 0%, #1f1a14 55%, #2c251c 100%);
    font-family: 'Nunito', 'Segoe UI', sans-serif;
    overflow: hidden;
  }
  .chrome {
    position: absolute;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    width: 360px;
    height: 68px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    background: transparent;
  }
  .pill {
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: 340px;
    padding: 7px 16px 7px 8px;
    border-radius: 999px;
    color: #f3eadc;
    background: linear-gradient(180deg, rgba(58, 48, 38, 0.90), rgba(24, 18, 14, 0.86));
    border: 1px solid rgba(243, 234, 220, 0.16);
    box-shadow:
      0 10px 28px rgba(0, 0, 0, 0.42),
      0 0 20px rgba(201, 168, 122, 0.22),
      inset 0 1px 0 rgba(255, 255, 255, 0.10);
    backdrop-filter: blur(22px) saturate(1.35);
  }
  .orb { position: relative; width: 28px; height: 28px; flex-shrink: 0; }
  .orb svg { width: 28px; height: 28px; display: block; }
  .track { fill: none; stroke: rgba(243, 234, 220, 0.14); stroke-width: 2.25; }
  .fill {
    fill: none; stroke: #c9a87a; stroke-width: 2.25; stroke-linecap: round;
    transform: rotate(-90deg); transform-origin: 14px 14px;
  }
  .core {
    position: absolute; left: 50%; top: 50%;
    width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px;
    border-radius: 50%; background: #c9a87a;
    box-shadow: 0 0 8px #c9a87a;
    animation: live 1.8s ease-in-out infinite;
  }
  @keyframes live {
    0%, 100% { opacity: 0.75; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.18); }
  }
  .time {
    font-family: 'DM Mono', 'Cascadia Mono', Consolas, monospace;
    font-size: 17px; letter-spacing: 0.04em; color: #f3eadc; line-height: 1;
  }
  .title {
    font-size: 12.5px; font-weight: 600; color: rgba(243, 234, 220, 0.62);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px;
  }
  .badge {
    position: absolute; top: 24px; left: 28px;
    color: rgba(240,233,220,0.45); font-size: 12px; font-weight: 600;
  }
</style>
</head>
<body>
  <div class="badge">WinUI shell preview — dark glass HUD, bottom center</div>
  <div class="chrome">
    <div class="pill">
      <span class="orb">
        <svg viewBox="0 0 28 28">
          <circle class="track" cx="14" cy="14" r="11"/>
          <circle class="fill" cx="14" cy="14" r="11" stroke-dasharray="69.115" stroke-dashoffset="1.29"/>
        </svg>
        <span class="core"></span>
      </span>
      <span class="time">24:32</span>
      <span class="title">Ship floating pill</span>
    </div>
  </div>
</body>
</html>
