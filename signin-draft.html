<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Draft Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #f0e9dc;
  --surface:   #ece4d5;
  --surface2:  #e4dac8;
  --surface3:  #d9cdb8;
  --border:    rgba(120,95,65,0.14);
  --border2:   rgba(120,95,65,0.22);
  --text:      #2e1f0d;
  --text2:     #6b5340;
  --muted:     #a08b75;
  --accent:    #7c5c3a;
  --accent2:   #a07850;
  --accent3:   #c9a87a;
  --red:       #b84f3a;
  --shadow2:   0 4px 24px rgba(80,50,20,0.14);
}

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
}

/* ── PROPOSED NEW DESIGN ── */
.modal-box {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 18px;
  box-shadow: var(--shadow2);
  width: 360px;
  padding: 36px 32px 28px;
  font-family: 'Nunito', sans-serif;
}

/* Branding at top */
.modal-brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  margin-bottom: 28px;
}

.modal-candle {
  font-size: 26px;
  line-height: 1;
  margin-bottom: 2px;
}

.modal-logo {
  font-family: 'Lora', serif;
  font-size: 22px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: 0.02em;
}

.modal-tagline {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
}

/* Title */
.modal-title {
  font-family: 'Lora', serif;
  font-size: 18px;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 20px;
  text-align: center;
}

/* Error */
.modal-error {
  font-size: 12px;
  color: var(--red);
  font-weight: 600;
  margin-bottom: 10px;
  min-height: 16px;
  text-align: center;
}

/* Input group with floating effect */
.input-group {
  position: relative;
  margin-bottom: 12px;
}

.input-group input {
  width: 100%;
  padding: 13px 14px 10px;
  border-radius: 10px;
  border: 1.5px solid var(--border2);
  background: var(--bg);
  color: var(--text);
  font-family: 'Nunito', sans-serif;
  font-size: 14px;
  font-weight: 600;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}

.input-group input:focus {
  border-color: var(--accent3);
  box-shadow: 0 0 0 3px rgba(201,168,122,0.15);
}

.input-group input::placeholder {
  color: var(--muted);
  font-weight: 500;
}

/* Primary sign-in button */
.btn-primary {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-family: 'Nunito', sans-serif;
  font-size: 14px;
  font-weight: 700;
  background: var(--accent);
  color: #f5ede0;
  letter-spacing: 0.03em;
  margin-top: 4px;
  margin-bottom: 16px;
  transition: background 0.15s, transform 0.1s;
  box-shadow: 0 2px 8px rgba(124,92,58,0.25);
}

.btn-primary:hover { background: var(--accent2); }
.btn-primary:active { transform: scale(0.98); }

/* OR divider */
.divider-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}

.divider-line {
  flex: 1;
  height: 1px;
  background: var(--border2);
}

.divider-text {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  flex-shrink: 0;
}

/* Social buttons */
.social-btn {
  width: 100%;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1.5px solid var(--border2);
  background: var(--surface2);
  color: var(--text2);
  font-family: 'Nunito', sans-serif;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: all 0.15s;
  margin-bottom: 8px;
}

.social-btn:hover {
  background: var(--surface3);
  border-color: rgba(120,95,65,0.35);
}

.social-btn:last-of-type { margin-bottom: 0; }

.social-icon {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}

/* Sign-up toggle */
.modal-toggle {
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  margin-top: 18px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}

.modal-toggle a {
  color: var(--accent2);
  cursor: pointer;
  font-weight: 700;
  text-decoration: none;
}

.modal-toggle a:hover { text-decoration: underline; }

/* ── COMPARISON LABELS ── */
.label-badge {
  display: inline-block;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 100px;
  margin-bottom: 16px;
  font-weight: 500;
}

.label-new { background: rgba(74,140,92,0.15); color: #4a8c5c; border: 1px solid rgba(74,140,92,0.3); }
</style>
</head>
<body>

<div style="text-align:center;">
  <div class="label-badge label-new">Proposed Design</div>

  <div class="modal-box">
    <!-- Brand header -->
    <div class="modal-brand">
      <div class="modal-candle">🕯</div>
      <div class="modal-logo">Tymos</div>
      <div class="modal-tagline">Pomodoro Timer</div>
    </div>

    <div class="modal-title">Welcome back</div>

    <div class="modal-error"></div>

    <!-- Inputs -->
    <div class="input-group">
      <input type="email" placeholder="Email" autocomplete="email" />
    </div>
    <div class="input-group">
      <input type="password" placeholder="Password" autocomplete="current-password" />
    </div>

    <!-- Sign in button -->
    <button class="btn-primary">Sign in</button>

    <!-- OR divider -->
    <div class="divider-row">
      <div class="divider-line"></div>
      <span class="divider-text">or continue with</span>
      <div class="divider-line"></div>
    </div>

    <!-- Social buttons side by side -->
    <div style="display:flex;gap:8px;">
      <button class="social-btn" style="margin-bottom:0;">
        <!-- GitHub icon -->
        <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        GitHub
      </button>
      <button class="social-btn" style="margin-bottom:0;">
        <!-- Google icon -->
        <svg class="social-icon" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Google
      </button>
    </div>

    <!-- Sign up toggle -->
    <div class="modal-toggle">
      Don't have an account? <a>Sign up</a>
    </div>
  </div>

  <p style="font-family:'DM Mono',monospace;font-size:10px;color:#a08b75;margin-top:20px;letter-spacing:0.08em;">DRAFT PREVIEW — not final</p>
</div>

</body>
</html>
